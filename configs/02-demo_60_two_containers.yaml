# Two-container demo (60 ticks). Same MS, heterogeneous replicas.
# Routing weight ∝ CPU headroom (alloc − min):
#   c-api-1: alloc=1.0 → headroom=0.5 → μ=50  (weight 0.25)
#   c-api-2: alloc=2.0 → headroom=1.5 → μ=150 (weight 0.75)
# Total μ=200. Trace api_60_two.csv peaks at 286 so overload/drops appear.

sim:
  tick_sec: 1.0
  results_dir: results/02-env-60tick/two_containers/
  seed: 42

traces_dir: traces/demo/

topology:
  clusters:
    - id: c1
      servers:
        - id: c1-w1
          cpu_cap_cores: 8.0
          ram_cap_mb: 16384
        - id: c1-w2
          cpu_cap_cores: 8.0
          ram_cap_mb: 16384

apps:
  - id: demo_app
    microservices:
      - id: api
        cpu_min_cores: 0.5
        cpu_max_cores: 4.0
        ram_min_mb: 256
        ram_max_mb: 4096
        cpu_per_request_cores: 0.01
        ram_per_request_mb: 0.5
        trace_file: api_60_two.csv
        containers:
          - id: c-api-1
            server_id: c1-w1
            cpu_alloc_cores: 1.0
            ram_alloc_mb: 512
          - id: c-api-2
            server_id: c1-w2
            cpu_alloc_cores: 2.0
            ram_alloc_mb: 1024

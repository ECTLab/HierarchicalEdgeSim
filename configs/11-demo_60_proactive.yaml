# Torch-free persistence smoke (same world as 08-demo_60_reactive_local.yaml).
# Option A TCN + Alibaba trace: configs/13-demo_alibaba_proactive.yaml

sim:
  tick_sec: 60.0  # one CSV row = one minute of requests
  results_dir: results/08-ladder-60tick/proactive/
  seed: 42

traces_dir: traces/demo/

topology:
  clusters:
    - id: c1
      servers:
        - id: c1-w1
          cpu_cap_cores: 8.0
          ram_cap_mb: 16384
        - id: c1-w2
          cpu_cap_cores: 8.0
          ram_cap_mb: 16384

apps:
  - id: demo_app
    microservices:
      - id: api
        cpu_min_cores: 0.5
        cpu_max_cores: 2.0
        ram_min_mb: 256
        ram_max_mb: 4096
        cpu_per_request_cores: 0.01
        ram_per_request_mb: 0.5
        trace_file: api_60_two.csv
        containers:
          - id: c-api-1
            server_id: c1-w1
            cpu_alloc_cores: 1.0
            ram_alloc_mb: 512

autoscaler:
  enabled: true
  name: proactive_auto_scaler
  decision_every_k_ticks: 1
  params:
    ticks_per_window: 1
    feature_window: 10
    forecast_horizon: 3
    theta_up: 0.80
    theta_down: 0.30
    theta_target: 0.60
    sustained_steps: 2
    cooldown_C: 3
    predictor: persistence
    x_up_streak: 3
    y_down_streak: 8
    cooldown_ticks: 5
    eps_drop: 1.0e-9
    theta_free: 0.35
    theta_high: 0.90
    use_near_saturation_up: false
    min_mu_step: 25
    prefer_consolidate_down: true
    sustained_up_streak: 6
    cascade_home: true
    grow_weights: { drop: 0.5, util: 0.3, room: 0.2 }
    shrink_weights: { slack: 0.5, no_drop: 0.3, room: 0.2 }

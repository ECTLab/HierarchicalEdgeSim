# Alibaba MS_150 transfer: same 4×8-core world as MS_588, Option A TCN.
# Same global weights; scaler is MS_150's full-series min-max (240-40083).
# MS_150 is ~4.6× heavier than MS_588 and is not 60-minute periodic.

sim:
  tick_sec: 60.0
  results_dir: results/05-alibaba-ms150/proactive/
  seed: 42

traces_dir: traces/alibaba/

topology:
  clusters:
    - id: c1
      servers:
        - id: c1-w1
          cpu_cap_cores: 8.0
          ram_cap_mb: 16384
        - id: c1-w2
          cpu_cap_cores: 8.0
          ram_cap_mb: 16384
        - id: c1-w3
          cpu_cap_cores: 8.0
          ram_cap_mb: 16384
        - id: c1-w4
          cpu_cap_cores: 8.0
          ram_cap_mb: 16384

apps:
  - id: demo_app
    microservices:
      - id: api
        cpu_min_cores: 0.5
        cpu_max_cores: 4.0
        ram_min_mb: 256
        ram_max_mb: 4096
        cpu_per_request_cores: 0.0004
        ram_per_request_mb: 0.02
        trace_file: MS_150.csv
        containers:
          - id: c-api-1
            server_id: c1-w1
            cpu_alloc_cores: 2.0
            ram_alloc_mb: 1024

autoscaler:
  enabled: true
  name: proactive_auto_scaler
  decision_every_k_ticks: 1
  params:
    ticks_per_window: 1
    feature_window: 60
    forecast_horizon: 5
    theta_up: 0.80
    theta_down: 0.30
    theta_target: 0.60
    sustained_steps: 99
    # Scale-down only (K8s HPA: scaleUp 0s, scaleDown 300s). 1 window = 1 min.
    cooldown_C: 5
    predictor: tcn_delta
    model_dir: models/tcn_delta_v1_ms150
    time_tick_offset: 0
    x_up_streak: 3
    y_down_streak: 8
    cooldown_ticks: 5
    eps_drop: 1.0e-9
    theta_free: 0.35
    theta_high: 0.90
    use_near_saturation_up: false
    min_mu_step: 25
    prefer_consolidate_down: true
    sustained_up_streak: 6
    cascade_home: true
    grow_weights: { drop: 0.5, util: 0.3, room: 0.2 }
    shrink_weights: { slack: 0.5, no_drop: 0.3, room: 0.2 }

# Same triangle load, vicinity-only: home worker is full, neighbor is fat.
# No third cluster, so BEG never has a legal candidate. Peak Λ=180 needs
# three extras; all fit on c2-w1 (8 cores). Isolates packed vicinity spawn
# + loan reclaim without BEG.

sim:
  tick_sec: 1.0
  results_dir: results/09-triangle-post-match/vicinity/
  seed: 42

traces_dir: traces/demo/

topology:
  clusters:
    - id: c1
      servers:
        - id: c1-w1
          cpu_cap_cores: 1.0
          ram_cap_mb: 512
    - id: c2
      servers:
        - id: c2-w1
          cpu_cap_cores: 8.0
          ram_cap_mb: 16384

  vicinities:
    - id: v1
      members: [c1, c2]
      leader: c1

apps:
  - id: demo_app
    microservices:
      - id: api
        cpu_min_cores: 0.5
        cpu_max_cores: 1.0
        ram_min_mb: 256
        ram_max_mb: 512
        cpu_per_request_cores: 0.01
        ram_per_request_mb: 0.5
        trace_file: api_400_triangle.csv
        containers:
          - id: c-api-0
            server_id: c1-w1
            cpu_alloc_cores: 1.0
            ram_alloc_mb: 512

autoscaler:
  enabled: true
  name: reactive_local
  decision_every_k_ticks: 1
  params:
    x_up_streak: 3
    y_down_streak: 8
    cooldown_ticks: 5
    eps_drop: 1.0e-9
    theta_free: 0.35
    theta_high: 0.90
    use_near_saturation_up: false
    delta_cpu_min_cores: 0.25
    delta_ram_min_mb: 128
    prefer_consolidate_down: true
    sustained_up_streak: 6
    cascade_home: false
    grow_weights: { drop: 0.5, util: 0.3, room: 0.2 }
    shrink_weights: { slack: 0.5, no_drop: 0.3, room: 0.2 }

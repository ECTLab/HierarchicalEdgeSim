# Four Alibaba traces, one app (campaign 13). ms150 hog, ms588 needle at
# minute 20, ms215 needle at minute ~8, ms693 slow wave.
# Home is 3×8 = 24 cores: the hog's sweet-spot mean is 16.8 and its p95 is
# 22.2, so the hog fits; the two needles together peak at 26.1, so they
# cannot both fit on home. Neighbor c2 is 4×8 = 32. Four-way sweet max is
# 52.5, so 24+32 covers it and a third cluster is not required.
# Seeds 2.0/1024. The hog has its own worker; the two lighter MS share w3.
# cascade_home on. Reactive baseline for config 39.

sim:
  tick_sec: 60.0
  results_dir: results/13-alibaba-4ms-eval/vicinity_reactive/
  seed: 42
  theta_route: 0.80

traces_dir: traces/alibaba/

x-worker: &w8
  cpu_cap_cores: 8.0
  ram_cap_mb: 16384

x-ms: &alibaba_ms
  cpu_min_cores: 0.5
  cpu_max_cores: 4.0
  ram_min_mb: 256
  ram_max_mb: 4096
  cpu_per_request_cores: 0.0004
  ram_per_request_mb: 0.02

topology:
  clusters:
    - id: c1
      servers:
        - {id: c1-w1, <<: *w8}
        - {id: c1-w2, <<: *w8}
        - {id: c1-w3, <<: *w8}
    - id: c2
      servers:
        - {id: c2-w1, <<: *w8}
        - {id: c2-w2, <<: *w8}
        - {id: c2-w3, <<: *w8}
        - {id: c2-w4, <<: *w8}

  vicinities:
    - id: v1
      members: [c1, c2]
      leader: c1

  latency_ms:
    - {from: c1, to: c2, ms: 5.0}

apps:
  - id: demo_app
    microservices:
      - <<: *alibaba_ms
        id: ms588
        trace_file: MS_588.csv
        containers:
          - {id: c-ms588-1, server_id: c1-w1, cpu_alloc_cores: 2.0, ram_alloc_mb: 1024}
      - <<: *alibaba_ms
        id: ms150
        trace_file: MS_150.csv
        containers:
          - {id: c-ms150-1, server_id: c1-w2, cpu_alloc_cores: 2.0, ram_alloc_mb: 1024}
      - <<: *alibaba_ms
        id: ms215
        trace_file: MS_215.csv
        containers:
          - {id: c-ms215-1, server_id: c1-w3, cpu_alloc_cores: 2.0, ram_alloc_mb: 1024}
      - <<: *alibaba_ms
        id: ms693
        trace_file: MS_693.csv
        containers:
          - {id: c-ms693-1, server_id: c1-w3, cpu_alloc_cores: 2.0, ram_alloc_mb: 1024}

autoscaler:
  enabled: true
  name: reactive_local
  decision_every_k_ticks: 1
  params:
    x_up_streak: 3
    y_down_streak: 8
    cooldown_ticks: 5
    eps_drop: 1.0e-9
    theta_free: 0.35
    theta_high: 0.80
    use_near_saturation_up: false
    min_mu_step: 25
    prefer_consolidate_down: true
    sustained_up_streak: 6
    cascade_home: true
    grow_weights: { drop: 0.5, util: 0.3, room: 0.2 }
    shrink_weights: { slack: 0.5, no_drop: 0.3, room: 0.2 }

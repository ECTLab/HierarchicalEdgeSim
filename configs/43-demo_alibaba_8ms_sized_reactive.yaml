# Eight Alibaba traces, one app (campaign 14). Home is 5×8 = 40 cores: the sitting group
# (ms150, ms133, ms693, ms859, ms460) averages 36.0 cores at θ=0.60, so
# it fits; the two needles together peak at 26.1 and cannot both sit
# there with that load. Neighbor c2 is 5×8 = 40. Eight-way sweet max is
# 75.0, so 40+40 covers it. Seeds 2.0/1024. The hog has its own worker.
# cascade_home on. Reactive baseline for config 44. c1–c2 latency 5.0 ms.

sim:
  tick_sec: 60.0
  results_dir: results/14-alibaba-8ms-eval/vicinity_reactive/
  seed: 42
  theta_route: 0.80

traces_dir: traces/alibaba/

x-worker: &w8
  cpu_cap_cores: 8.0
  ram_cap_mb: 16384

x-ms: &alibaba_ms
  cpu_min_cores: 0.5
  cpu_max_cores: 4.0
  ram_min_mb: 256
  ram_max_mb: 4096
  cpu_per_request_cores: 0.0004
  ram_per_request_mb: 0.02

topology:
  clusters:
    - id: c1
      servers:
        - {id: c1-w1, <<: *w8}
        - {id: c1-w2, <<: *w8}
        - {id: c1-w3, <<: *w8}
        - {id: c1-w4, <<: *w8}
        - {id: c1-w5, <<: *w8}
    - id: c2
      servers:
        - {id: c2-w1, <<: *w8}
        - {id: c2-w2, <<: *w8}
        - {id: c2-w3, <<: *w8}
        - {id: c2-w4, <<: *w8}
        - {id: c2-w5, <<: *w8}

  vicinities:
    - id: v1
      members: [c1, c2]
      leader: c1

  latency_ms:
    - {from: c1, to: c2, ms: 5.0}

apps:
  - id: demo_app
    microservices:
      - <<: *alibaba_ms
        id: ms588
        trace_file: MS_588.csv
        containers:
          - {id: c-ms588-1, server_id: c1-w1, cpu_alloc_cores: 2.0, ram_alloc_mb: 1024}
      - <<: *alibaba_ms
        id: ms133
        trace_file: MS_133.csv
        containers:
          - {id: c-ms133-1, server_id: c1-w1, cpu_alloc_cores: 2.0, ram_alloc_mb: 1024}
      - <<: *alibaba_ms
        id: ms150
        trace_file: MS_150.csv
        containers:
          - {id: c-ms150-1, server_id: c1-w2, cpu_alloc_cores: 2.0, ram_alloc_mb: 1024}
      - <<: *alibaba_ms
        id: ms215
        trace_file: MS_215.csv
        containers:
          - {id: c-ms215-1, server_id: c1-w3, cpu_alloc_cores: 2.0, ram_alloc_mb: 1024}
      - <<: *alibaba_ms
        id: ms205
        trace_file: MS_205.csv
        containers:
          - {id: c-ms205-1, server_id: c1-w3, cpu_alloc_cores: 2.0, ram_alloc_mb: 1024}
      - <<: *alibaba_ms
        id: ms693
        trace_file: MS_693.csv
        containers:
          - {id: c-ms693-1, server_id: c1-w4, cpu_alloc_cores: 2.0, ram_alloc_mb: 1024}
      - <<: *alibaba_ms
        id: ms460
        trace_file: MS_460.csv
        containers:
          - {id: c-ms460-1, server_id: c1-w4, cpu_alloc_cores: 2.0, ram_alloc_mb: 1024}
      - <<: *alibaba_ms
        id: ms859
        trace_file: MS_859.csv
        containers:
          - {id: c-ms859-1, server_id: c1-w5, cpu_alloc_cores: 2.0, ram_alloc_mb: 1024}

autoscaler:
  enabled: true
  name: reactive_local
  decision_every_k_ticks: 1
  params:
    x_up_streak: 3
    y_down_streak: 8
    cooldown_ticks: 5
    eps_drop: 1.0e-9
    theta_free: 0.35
    theta_high: 0.80
    use_near_saturation_up: false
    min_mu_step: 25
    prefer_consolidate_down: true
    sustained_up_streak: 6
    cascade_home: true
    grow_weights: { drop: 0.5, util: 0.3, room: 0.2 }
    shrink_weights: { slack: 0.5, no_drop: 0.3, room: 0.2 }

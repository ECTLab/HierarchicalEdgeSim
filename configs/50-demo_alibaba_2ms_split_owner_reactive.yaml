# Campaign 15. Two apps on a 48-core vicinity. ms588 owns c1 (1×8),
# ms150 owns c2 (1×8). c3 (4×8) hosts no app. Each home is below the
# hog's reactive peak (~14 cores) and below both forecast peaks, so
# overflow borrows c3 before the other service's home. Latency 5.0 ms
# on every pair. Seeds 2.0/1024. Reactive.

sim:
  tick_sec: 60.0
  results_dir: results/15-alibaba-2ms-split-owner/vicinity_reactive/
  seed: 42
  theta_route: 0.80

traces_dir: traces/alibaba/

x-worker: &w8
  cpu_cap_cores: 8.0
  ram_cap_mb: 16384

x-ms: &alibaba_ms
  cpu_min_cores: 0.5
  cpu_max_cores: 4.0
  ram_min_mb: 256
  ram_max_mb: 4096
  cpu_per_request_cores: 0.0004
  ram_per_request_mb: 0.02

topology:
  clusters:
    - id: c1
      servers:
        - {id: c1-w1, <<: *w8}
    - id: c2
      servers:
        - {id: c2-w1, <<: *w8}
    - id: c3
      servers:
        - {id: c3-w1, <<: *w8}
        - {id: c3-w2, <<: *w8}
        - {id: c3-w3, <<: *w8}
        - {id: c3-w4, <<: *w8}

  vicinities:
    - id: v1
      members: [c3, c1, c2]
      leader: c1

  latency_ms:
    - {from: c1, to: c2, ms: 5.0}
    - {from: c1, to: c3, ms: 5.0}
    - {from: c2, to: c3, ms: 5.0}

apps:
  - id: app_ms588
    microservices:
      - <<: *alibaba_ms
        id: ms588
        trace_file: MS_588.csv
        containers:
          - {id: c-ms588-1, server_id: c1-w1, cpu_alloc_cores: 2.0, ram_alloc_mb: 1024}
  - id: app_ms150
    microservices:
      - <<: *alibaba_ms
        id: ms150
        trace_file: MS_150.csv
        containers:
          - {id: c-ms150-1, server_id: c2-w1, cpu_alloc_cores: 2.0, ram_alloc_mb: 1024}

autoscaler:
  enabled: true
  name: reactive_local
  decision_every_k_ticks: 1
  params:
    x_up_streak: 3
    y_down_streak: 8
    cooldown_ticks: 5
    eps_drop: 1.0e-9
    theta_free: 0.35
    theta_high: 0.80
    use_near_saturation_up: false
    min_mu_step: 25
    prefer_consolidate_down: true
    sustained_up_streak: 6
    cascade_home: true
    grow_weights: { drop: 0.5, util: 0.3, room: 0.2 }
    shrink_weights: { slack: 0.5, no_drop: 0.3, room: 0.2 }

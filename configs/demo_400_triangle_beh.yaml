# Same triangle load as demo_400_triangle_beg.yaml, but the leftover stays
# in-cluster: seed fills c1-w1; c1-w2 is an empty sibling (BEH). No vicinities.
#
# cpu_max=1.0 ⇒ μ_max = 50. Peak Λ=180 needs four full replicas. All extras
# land on c1-w2. Descent reclaims those BEH replicas; among equal local μ the
# original seed can be retired (same loan tier). Surplus then sizes whoever
# remains. Isolates packed local spawn + surplus hold without S4/S5.

sim:
  tick_sec: 1.0
  results_dir: results/triangle_beh/
  seed: 42

traces_dir: traces/demo/

topology:
  clusters:
    - id: c1
      servers:
        - id: c1-w1
          cpu_cap_cores: 1.0
          ram_cap_mb: 512
        - id: c1-w2
          cpu_cap_cores: 8.0
          ram_cap_mb: 16384

apps:
  - id: demo_app
    microservices:
      - id: api
        cpu_min_cores: 0.5
        cpu_max_cores: 1.0
        ram_min_mb: 256
        ram_max_mb: 512
        cpu_per_request_cores: 0.01
        ram_per_request_mb: 0.5
        trace_file: api_400_triangle.csv
        containers:
          - id: c-api-0
            server_id: c1-w1
            cpu_alloc_cores: 1.0
            ram_alloc_mb: 512

autoscaler:
  enabled: true
  name: reactive_local
  decision_every_k_ticks: 1
  params:
    x_up_streak: 3
    y_down_streak: 8
    cooldown_ticks: 5
    eps_drop: 1.0e-9
    theta_free: 0.35
    theta_high: 0.90
    use_near_saturation_up: false
    alpha_up: 0.20
    alpha_down: 0.10
    delta_cpu_min_cores: 0.25
    delta_ram_min_mb: 128
    prefer_consolidate_down: true
    sustained_up_streak: 6
    cascade_home: false
    grow_weights: { drop: 0.5, util: 0.3, room: 0.2 }
    shrink_weights: { slack: 0.5, no_drop: 0.3, room: 0.2 }

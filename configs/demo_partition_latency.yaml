# Algorithm 1 demo: vicinities from a complete latency_ms matrix (no coords).
#
# Same grouping story as demo_partition.yaml, but d(c,c') is RTT in ms:
#   nyc-a ↔ nyc-b = 2 ms     (one metro)
#   lon-a ↔ lon-b = 2 ms     (another metro)
#   nyc ↔ lon     = 40 ms
#   anyone ↔ remote = 200 ms
#
# k=0.5 so the z-score cut keeps a metro pair without swallowing the other
# continent (k=1 leaves V_cand empty because the remote site inflates σ).
# Expected groups (vicinity ids follow formation order):
#   {nyc-a, nyc-b}  leader nyc-a (more cap)
#   {lon-a, lon-b}  leader lon-a
#   {remote}

sim:
  tick_sec: 1.0
  results_dir: results/partition_latency/
  seed: 42

traces_dir: traces/demo/

topology:
  clusters:
    - id: nyc-a
      servers:
        - id: nyc-a-w1
          cpu_cap_cores: 16.0
          ram_cap_mb: 32768
    - id: nyc-b
      servers:
        - id: nyc-b-w1
          cpu_cap_cores: 4.0
          ram_cap_mb: 8192
    - id: lon-a
      servers:
        - id: lon-a-w1
          cpu_cap_cores: 16.0
          ram_cap_mb: 32768
    - id: lon-b
      servers:
        - id: lon-b-w1
          cpu_cap_cores: 4.0
          ram_cap_mb: 8192
    - id: remote
      servers:
        - id: remote-w1
          cpu_cap_cores: 8.0
          ram_cap_mb: 16384

  latency_ms:
    - {from: nyc-a, to: nyc-b, ms: 2.0}
    - {from: nyc-a, to: lon-a, ms: 40.0}
    - {from: nyc-a, to: lon-b, ms: 40.0}
    - {from: nyc-a, to: remote, ms: 200.0}
    - {from: nyc-b, to: lon-a, ms: 40.0}
    - {from: nyc-b, to: lon-b, ms: 40.0}
    - {from: nyc-b, to: remote, ms: 200.0}
    - {from: lon-a, to: lon-b, ms: 2.0}
    - {from: lon-a, to: remote, ms: 200.0}
    - {from: lon-b, to: remote, ms: 200.0}

  partition:
    k: 0.5
    m_max: 5

apps:
  - id: demo_app
    microservices:
      - id: api
        cpu_min_cores: 0.5
        cpu_max_cores: 4.0
        ram_min_mb: 256
        ram_max_mb: 4096
        cpu_per_request_cores: 0.01
        ram_per_request_mb: 0.5
        trace_file: api.csv
        containers:
          - id: c-api-1
            server_id: nyc-a-w1
            cpu_alloc_cores: 1.0
            ram_alloc_mb: 512

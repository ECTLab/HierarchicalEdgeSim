# FIFA day 80 (1 Hz) offered load + proactive LSTM — first 1 hour only (3600 ticks).
# Trace: traces/demo/api_wc_day80_1s.csv (prefix of wc_day80_bursts_1s.csv).
# tick_sec=1, ttw_ticks=60 → each TTW RPS ≈ mean requests/sec over that minute
# (same scale family as minute-avg training if artifacts were trained that way).
#
# Model files (default location — copy trained artifacts here, or override paths):
#   models/rps_lstm_v1/lstm_edge_weights.pth
#   models/rps_lstm_v1/traffic_scaler.pkl
#   models/rps_lstm_v1/meta.json
# feature_window must match meta.json.

sim:
  tick_sec: 1.0
  results_dir: results/proactive_wc_day80_lstm/
  seed: 42

traces_dir: traces/demo/

topology:
  clusters:
    - id: c1
      servers:
        - id: c1-w1
          cpu_cap_cores: 8.0
          ram_cap_mb: 16384
        - id: c1-w2
          cpu_cap_cores: 8.0
          ram_cap_mb: 16384

apps:
  - id: demo_app
    microservices:
      - id: api
        cpu_min_cores: 0.5
        cpu_max_cores: 4.0
        ram_min_mb: 256
        ram_max_mb: 4096
        cpu_per_request_cores: 0.01
        ram_per_request_mb: 0.5
        trace_file: api_wc_day80_1s.csv
        containers:
          - id: c-api-1
            server_id: c1-w1
            cpu_alloc_cores: 1.0
            ram_alloc_mb: 512
          - id: c-api-2
            server_id: c1-w2
            cpu_alloc_cores: 2.0
            ram_alloc_mb: 1024

autoscaler:
  enabled: true
  name: proactive_auto_scaler
  params:
    ttw_ticks: 60
    feature_window: 10
    horizon_H: 3
    predictor: lstm
    model_path: models/rps_lstm_v1/lstm_edge_weights.pth
    scaler_path: models/rps_lstm_v1/traffic_scaler.pkl
    meta_path: models/rps_lstm_v1/meta.json
